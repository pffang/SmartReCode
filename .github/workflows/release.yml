name: Build, sign and release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag matching the MSIX version, e.g. v1.0.0.0"
        required: true
        type: string

permissions: {}

concurrency:
  group: msix-release
  cancel-in-progress: false

jobs:
  build-and-sign:
    runs-on: windows-2025
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out selected commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate release configuration
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          SIGNPATH_CERTIFICATE_SUBJECT: ${{ vars.SIGNPATH_CERTIFICATE_SUBJECT }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -cnotmatch '^v(0|[1-9]\d{0,4})\.(0|[1-9]\d{0,4})\.(0|[1-9]\d{0,4})\.(0|[1-9]\d{0,4})$') {
            throw 'Tag must be v followed by four numeric MSIX version components.'
          }
          $version = $env:RELEASE_TAG.Substring(1)
          if (@($version.Split('.') | Where-Object { [int]$_ -gt 65535 }).Count -gt 0) {
            throw 'Each MSIX version component must be at most 65535.'
          }
          [xml]$manifest = Get-Content -LiteralPath 'Package.appxmanifest' -Raw
          if ($manifest.Package.Identity.Version -cne $version) {
            throw 'The tag version must match Package.appxmanifest Identity Version.'
          }
          foreach ($name in @('SIGNPATH_ORGANIZATION_ID', 'SIGNPATH_PROJECT_SLUG', 'SIGNPATH_SIGNING_POLICY_SLUG', 'SIGNPATH_ARTIFACT_CONFIGURATION_SLUG', 'SIGNPATH_CERTIFICATE_SUBJECT')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Repository variable $name is required."
            }
          }
          if ($manifest.Package.Identity.Publisher -cne $env:SIGNPATH_CERTIFICATE_SUBJECT) {
            throw 'The manifest Publisher must match SIGNPATH_CERTIFICATE_SUBJECT.'
          }

      - name: Install WinApp CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'winappcli-0.8.0.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'winappcli'
          Invoke-WebRequest -Uri 'https://github.com/microsoft/WinAppCli/releases/download/v0.8.0/winappcli-x64.zip' -OutFile $archive
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($hash -cne '67A8E1D39421A5EF5309C7017327C6A70EA6215A0E56E47EC22A7E9EC3B914E6') {
            throw 'WinApp CLI archive checksum mismatch.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          $directory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Restore Windows App SDK
        shell: pwsh
        env:
          WINAPP_CLI_TELEMETRY_OPTOUT: '1'
        run: |
          winapp restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure and test
        shell: pwsh
        run: |
          cmake -S . -B build\msix-x64 -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build\msix-x64 --config Release --target recoder_tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build\msix-x64 -C Release -R '^recoder_tests$' --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build unsigned MSIX
        shell: pwsh
        run: .\package-msix.ps1

      - name: Upload unsigned package for SignPath
        id: unsigned
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-msix
          path: build\msix-x64\SmartRecoder-x64.msix
          archive: true
          if-no-files-found: error
          retention-days: 7

      - name: Submit SignPath signing request
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 19800
          output-artifact-directory: signed

      - name: Verify signed package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $PWD 'signed\SmartRecoder-x64.msix'
          if (!(Test-Path -LiteralPath $package -PathType Leaf)) { throw 'SignPath did not return the expected package.' }
          $kits = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots').KitsRoot10
          $signtool = Get-ChildItem (Join-Path $kits 'bin') -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64\signtool.exe' } |
            Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (!$signtool) { throw 'Windows SDK signtool.exe not found.' }
          & $signtool verify /pa /v $package
          if ($LASTEXITCODE -ne 0) { throw "Signature verification failed: $LASTEXITCODE" }

      - name: Upload signed package
        uses: actions/upload-artifact@v7
        with:
          name: signed-msix
          path: signed\SmartRecoder-x64.msix
          archive: true
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build-and-sign
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - name: Download signed package
        uses: actions/download-artifact@v8
        with:
          name: signed-msix
          path: signed

      - name: Create tag and release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $PWD 'signed\SmartRecoder-x64.msix'
          if (!(Test-Path -LiteralPath $package -PathType Leaf)) { throw 'Signed package is missing.' }
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$env:RELEASE_TAG" -f "sha=$env:GITHUB_SHA" --silent
          if ($LASTEXITCODE -ne 0) { throw 'Tag creation failed; the tag may already exist.' }
          gh release create $env:RELEASE_TAG $package --verify-tag --title $env:RELEASE_TAG --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed. The newly created tag was retained.' }
